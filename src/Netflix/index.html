<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Netflix - JsonFakery</title>
   <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
   <style>
      :root {
         --primary: #E50914;
         --dark: #141414;
         --gray: #b3b3b3;
         --white: #fff;
      }

      * {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
      }

      body {
         background: var(--dark);
         color: var(--white);
         font-family: 'Helvetica Neue', sans-serif;
         overflow-x: hidden;
      }

      /* NAVBAR */
      .navbar {
         position: fixed;
         top: 0;
         width: 100%;
         height: 60px;
         padding: 0 4%;
         display: flex;
         align-items: center;
         justify-content: space-between;
         background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent);
         z-index: 100;
         transition: 0.3s;
      }

      .navbar.scrolled {
         background: var(--dark);
      }

      .logo {
         color: var(--primary);
         font-size: 1.5rem;
         font-weight: bold;
      }

      /* HERO */
      .hero {
         height: 80vh;
         position: relative;
         background-size: cover;
         background-position: center;
      }

      .hero::after {
         content: '';
         position: absolute;
         inset: 0;
         background: linear-gradient(to top, var(--dark), transparent 50%);
      }

      .hero-content {
         position: absolute;
         bottom: 150px;
         left: 4%;
         max-width: 500px;
         z-index: 10;
      }

      .hero-title {
         font-size: 3rem;
         margin-bottom: 1rem;
         text-shadow: 2px 2px 4px black;
      }

      .hero-desc {
         font-size: 1.1rem;
         line-height: 1.4;
         margin-bottom: 20px;
         text-shadow: 1px 1px 2px black;
         display: -webkit-box;
         -webkit-line-clamp: 3;
         -webkit-box-orient: vertical;
         overflow: hidden;
      }

      .btn {
         padding: 10px 25px;
         border-radius: 4px;
         border: none;
         font-weight: bold;
         cursor: pointer;
         margin-right: 10px;
      }

      .btn-play {
         background: white;
         color: black;
      }

      .btn-info {
         background: rgba(109, 109, 110, 0.7);
         color: white;
      }

      /* ROWS */
      .category-section {
         padding: 20px 0 20px 4%;
      }

      .category-title {
         font-size: 1.2rem;
         font-weight: 500;
         margin-bottom: 10px;
         color: #e5e5e5;
      }

      .movie-row {
         display: flex;
         overflow-x: auto;
         gap: 10px;
         padding-bottom: 20px;
         scroll-behavior: smooth;
      }

      ::-webkit-scrollbar {
         height: 8px;
      }

      ::-webkit-scrollbar-track {
         background: #141414;
      }

      ::-webkit-scrollbar-thumb {
         background-color: #333;
         border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
         background-color: #E50914;
      }

      .movie-card {
         flex: 0 0 auto;
         width: 180px;
         transition: 0.3s;
         cursor: pointer;
         border-radius: 4px;
         overflow: hidden;
         position: relative;
      }

      .movie-card img {
         width: 100%;
         aspect-ratio: 2/3;
         object-fit: cover;
      }

      .movie-card:hover {
         transform: scale(1.1);
         z-index: 10;
      }

      /* MODAL */
      .modal-overlay {
         position: fixed;
         inset: 0;
         background: rgba(0, 0, 0, 0.8);
         z-index: 1000;
         display: none;
         justify-content: center;
         align-items: center;
         backdrop-filter: blur(5px);
      }

      .modal-overlay.active {
         display: flex;
         animation: fadeIn 0.3s;
      }

      .modal-box {
         width: 90%;
         max-width: 800px;
         background: #181818;
         border-radius: 8px;
         overflow: hidden;
         position: relative;
         max-height: 90vh;
         overflow-y: auto;
      }

      .close-btn {
         position: absolute;
         top: 15px;
         right: 20px;
         font-size: 2rem;
         cursor: pointer;
         z-index: 20;
         color: white;
         background: rgba(0, 0, 0, 0.5);
         width: 40px;
         height: 40px;
         border-radius: 50%;
         text-align: center;
         line-height: 40px;
      }

      .modal-banner {
         width: 100%;
         height: 350px;
         object-fit: cover;
         mask-image: linear-gradient(to bottom, black 70%, transparent);
      }

      .modal-info {
         padding: 20px 40px;
         margin-top: -60px;
         position: relative;
      }

      .modal-header {
         font-size: 2.5rem;
         margin-bottom: 10px;
         font-weight: bold;
      }

      .modal-stats {
         color: #46d369;
         font-weight: bold;
         margin-bottom: 15px;
      }

      .modal-overview {
         line-height: 1.6;
         color: #ccc;
         margin-bottom: 20px;
      }

      .cast-list {
         display: flex;
         gap: 15px;
         overflow-x: auto;
         padding-bottom: 10px;
      }

      .cast-item {
         min-width: 100px;
         text-align: center;
         font-size: 0.8rem;
         color: #ccc;
      }

      .cast-img {
         width: 60px;
         height: 60px;
         border-radius: 50%;
         object-fit: cover;
         margin-bottom: 5px;
         background: #333;
      }

      @keyframes fadeIn {
         from {
            opacity: 0;
         }

         to {
            opacity: 1;
         }
      }
   </style>
</head>

<body>

   <nav class="navbar" id="navbar">
      <div class="logo">NETFLIX</div>
      <i class="fas fa-user"></i>
   </nav>

   <header class="hero" id="hero">
      <div class="hero-content">
         <h1 class="hero-title" id="heroTitle">Loading...</h1>
         <p class="hero-desc" id="heroDesc">Please wait...</p>
         <button class="btn btn-play"><i class="fas fa-play"></i> Play</button>
         <button class="btn btn-info"><i class="fas fa-info-circle"></i> Info</button>
      </div>
   </header>

   <div id="mainContainer">
   </div>

   <div class="modal-overlay" id="modal">
      <div class="modal-box">
         <span class="close-btn">&times;</span>
         <img src="" class="modal-banner" id="mBanner">
         <div class="modal-info">
            <h2 class="modal-header" id="mTitle">Movie Title</h2>
            <div class="modal-stats">Rating: <span id="mRating"></span>/10</div>
            <p class="modal-overview" id="mDesc">Description...</p>

            <h4 style="margin-bottom: 10px; color: white;">Cast</h4>
            <div class="cast-list" id="mCastList">
            </div>
         </div>
      </div>
   </div>

   <script src="script.js"></script>
</body>

</html>
