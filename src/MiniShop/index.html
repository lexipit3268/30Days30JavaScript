<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <title>Better Shop Dark Mode</title>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
   <style>
      :root {
         --bg-body: #08090a;
         --bg-card: #131415;
         --bg-header: rgba(19, 20, 21, 0.8);
         --border-color: #2a2b2d;
         --text-primary: #ffffff;
         --text-secondary: #9ca3af;
         --accent-color: #4f46e5;
         --accent-hover: #4338ca;
         --danger-color: #ef4444;
      }

      * {
         box-sizing: border-box;
      }

      body {
         font-family: 'Inter', sans-serif;
         background-color: var(--bg-body);
         color: var(--text-primary);
         margin: 0;
         padding: 40px 20px;
         line-height: 1.5;
      }

      .container {
         max-width: 1200px;
         margin: 0 auto;
      }

      header {
         display: flex;
         justify-content: space-between;
         align-items: center;
         margin-bottom: 40px;
         padding: 20px 24px;
         background: var(--bg-header);
         border: 1px solid var(--border-color);
         border-radius: 12px;
         position: sticky;
         top: 20px;
         z-index: 100;
         backdrop-filter: blur(12px);
      }

      .filters {
         display: flex;
         gap: 8px;
         flex-wrap: wrap;
      }

      .filters button {
         padding: 8px 16px;
         background: transparent;
         border: 1px solid var(--border-color);
         color: var(--text-secondary);
         border-radius: 6px;
         cursor: pointer;
         font-size: 0.875rem;
         font-weight: 500;
         font-family: inherit;
         transition: all 0.2s ease;
      }

      .filters button:hover {
         border-color: var(--text-secondary);
         color: var(--text-primary);
      }

      .filters button.active {
         background: var(--text-primary);
         color: var(--bg-body);
         border-color: var(--text-primary);
      }

      .cart-info {
         font-weight: 600;
         font-size: 0.95rem;
         color: var(--text-secondary);
         display: flex;
         align-items: center;
         gap: 10px;
      }

      .cart-highlight {
         color: var(--text-primary);
         background: var(--border-color);
         padding: 4px 10px;
         border-radius: 6px;
         font-feature-settings: "tnum";
      }

      .product-grid {
         display: grid;
         grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
         gap: 32px;
         align-items: stretch;
      }

      .product-card {
         background: var(--bg-card);
         border: 1px solid var(--border-color);
         border-radius: 12px;
         padding: 20px;
         display: flex;
         flex-direction: column;
         transition: transform 0.2s ease, border-color 0.2s ease;
         height: 100%;
      }

      .product-card:hover {
         border-color: var(--text-secondary);
         transform: translateY(-4px);
      }

      .img-container {
         background: #ffffff;
         border-radius: 8px;
         padding: 16px;
         margin-bottom: 20px;
         height: 200px;
         display: flex;
         align-items: center;
         justify-content: center;
         position: relative;
         overflow: hidden;
      }

      .product-img {
         width: 100%;
         height: 100%;
         object-fit: contain;
         transition: transform 0.3s ease;
      }

      .product-card:hover .product-img {
         transform: scale(1.05);
      }

      .product-content {
         flex: 1;
         display: flex;
         flex-direction: column;
      }

      .product-title {
         font-size: 1rem;
         font-weight: 600;
         margin: 0 0 8px 0;
         color: var(--text-primary);
         display: -webkit-box;
         -webkit-line-clamp: 2;
         -webkit-box-orient: vertical;
         overflow: hidden;
         min-height: 3rem;
         line-height: 1.5;
      }

      .product-price {
         font-size: 1.25rem;
         font-weight: 700;
         color: var(--text-primary);
         margin: 0 0 20px 0;
         letter-spacing: -0.02em;
      }

      .btn-add {
         margin-top: auto;
         width: 100%;
         padding: 12px;
         background: var(--accent-color);
         color: white;
         border: none;
         border-radius: 8px;
         font-weight: 600;
         cursor: pointer;
         font-size: 0.9rem;
         transition: background 0.2s ease;
      }

      .btn-add:hover {
         background: var(--accent-hover);
      }

      .loading {
         grid-column: 1 / -1;
         text-align: center;
         padding: 60px;
         color: var(--text-secondary);
         font-size: 1.1rem;
      }

      @media (max-width: 768px) {
         header {
            flex-direction: column;
            gap: 20px;
            align-items: stretch;
         }

         .filters {
            justify-content: center;
         }

         .cart-info {
            justify-content: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
         }
      }
   </style>
</head>

<body>

   <div class="container">
      <header>
         <div class="filters" id="filterBtnContainer">
            <button class="active" data-category="all">All</button>
            <button data-category="electronics">Electronics</button>
            <button data-category="jewelery">Jewelry</button>
            <button data-category="men's clothing">Men's</button>
            <button data-category="women's clothing">Women's</button>
         </div>
         <div class="cart-info">
            Cart: <span class="cart-highlight" id="cartCount">0</span>
            Total: <span class="cart-highlight">$<span id="cartTotal">0.00</span></span>
         </div>
      </header>

      <div class="product-grid" id="productContainer"></div>
   </div>

   <script>
      const productContainer = document.getElementById('productContainer');
      const cartCountEl = document.getElementById('cartCount');
      const cartTotalEl = document.getElementById('cartTotal');
      const filterBtns = document.querySelectorAll('.filters button');

      let cart = [];
      let allProducts = [];
      const apiUrl = "https://fakestoreapi.com/products";

      async function fetchProducts() {
         productContainer.innerHTML = `<div class="loading">Loading products...</div>`;
         try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("Connection error");
            allProducts = await response.json();
            renderProducts(allProducts);
         } catch (error) {
            productContainer.innerHTML = `<div class="loading" style="color: var(--danger-color)">${error.message}</div>`;
         }
      }

      function renderProducts(list) {
         productContainer.innerHTML = "";
         let fragment = document.createDocumentFragment();
         list.forEach(item => {
            const div = document.createElement("div");
            div.classList.add("product-card");
            div.innerHTML = `
                    <div class="img-container">
                        <img src="${item.image}" class="product-img" alt="${item.title}">
                    </div>
                    <div class="product-content">
                        <h3 class="product-title" title="${item.title}">${item.title}</h3>
                        <p class="product-price">$${item.price.toFixed(2)}</p>
                        <button class="btn-add" data-id="${item.id}">Add to Cart</button>
                    </div>
                `;
            fragment.appendChild(div);
         });
         productContainer.append(fragment);
      }

      function handleFilter(e) {
         const btn = e.target;
         if (!btn) return;
         if (!btn.classList.contains("active")) {
            filterBtns.forEach(otherBtn => {
               otherBtn.classList.remove("active");
            })
            btn.classList.add("active");
         }
         const category = btn.dataset.category;
         if (category === "all") {
            renderProducts(allProducts);
         } else {
            const filteredProducts = allProducts.filter(item => item.category === category);
            renderProducts(filteredProducts);
         }
      }

      function addToCart(productID) {
         const product = allProducts.find(item => item.id === productID);
         cart.push(product);
         updateCart();
      }

      function updateCart() {
         let count = cart.length;
         let total = cart.reduce((sum, product) => sum + product.price, 0);
         cartCountEl.innerText = count;
         cartTotalEl.innerText = total.toFixed(2);
      }

      filterBtns.forEach(filterBtn => {
         filterBtn.addEventListener("click", handleFilter);
      });

      productContainer.addEventListener('click', function (e) {
         if (e.target.classList.contains("btn-add")) {
            const id = Number(e.target.dataset.id);
            addToCart(id);
         }
      })

      fetchProducts();
   </script>
</body>

</html>
